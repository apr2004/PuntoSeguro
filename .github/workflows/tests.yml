name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Suite completa del backend (Testcontainers usa el Docker del runner).
      # Los casos ficticios con el LLM real (FictitiousCasesTest) se saltan: en CI no hay clave.
      - run: bash ./mvnw -B test
