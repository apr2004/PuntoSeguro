spring.application.name=PuntoSeguro
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/puntoseguro}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:puntoseguro}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dev-only-change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.jpa.open-in-view=false
puntoseguro.jwt.secret=${PUNTOSEGURO_JWT_SECRET:}
puntoseguro.jwt.issuer=${PUNTOSEGURO_JWT_ISSUER:puntoseguro}
puntoseguro.jwt.audience=${PUNTOSEGURO_JWT_AUDIENCE:puntoseguro-api}
puntoseguro.jwt.access-token-ttl-seconds=${PUNTOSEGURO_JWT_TTL_SECONDS:259200}
server.error.include-message=always
puntoseguro.llm.url=${PUNTOSEGURO_LLM_URL:https://api.groq.com/openai/v1}
puntoseguro.llm.model=${PUNTOSEGURO_LLM_MODELO:openai/gpt-oss-20b}
puntoseguro.llm.api-key=${PUNTOSEGURO_LLM_API_KEY:}
puntoseguro.llm.timeout-seconds=${PUNTOSEGURO_LLM_TIMEOUT:60}
