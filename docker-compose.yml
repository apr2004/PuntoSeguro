# Arranque: docker compose up -d   (la primera vez descarga el modelo, tarda unos minutos)
# Cambiar de modelo: PUNTOSEGURO_MODELO=qwen3:4b docker compose up -d
x-modelo: &modelo
  PUNTOSEGURO_MODELO: ${PUNTOSEGURO_MODELO:-qwen3:1.7b}

services:
  ollama:
    image: ollama/ollama:0.40.9
    ports:
      - "11435:11434" # 11435 en la máquina para no chocar con un Ollama nativo en el 11434
    volumes:
      - ollama-modelos:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-init:
    image: ollama/ollama:0.40.9
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      <<: *modelo
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull \"$$PUNTOSEGURO_MODELO\""]
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    environment:
      <<: *modelo
      OLLAMA_HOST: http://ollama:11434
      PUNTOSEGURO_TIMEOUT: ${PUNTOSEGURO_TIMEOUT:-60}
    volumes:
      - ./backend:/app
    command: ["sleep", "infinity"]

volumes:
  ollama-modelos:
